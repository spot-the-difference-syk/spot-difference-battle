# Local development and E2E only (`wrangler dev`). Same as wrangler.toml without Hyperdrive,
# because wrangler dev refuses a Hyperdrive binding without a local Postgres connection string.
# Keep this file in sync with wrangler.toml.
name = "spot-difference-game"
main = "src/index.ts"
compatibility_date = "2026-09-16"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../../apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/ws", "/health", "/catalog"]

[vars]
# 앱인토스(실서비스·QR 테스트), Android 앱(WebViewAssetLoader), iOS 앱(Capacitor)
ALLOWED_ORIGINS = "https://spot-difference-syk.web.tossmini.com,https://spot-difference-syk.private-web.tossmini.com,https://appassets.androidplatform.net,capacitor://localhost"
PUZZLE_CATALOG_SOURCE = "code"
# database 카탈로그로 바꾸면 그림 주소를 이 R2 전달 Worker로 만든다.
PUZZLE_ASSET_BASE_URL = "https://spot-difference-r2-canary.spot-difference-9barcode.workers.dev"

[[durable_objects.bindings]]
name = "GAME_LOBBY"
class_name = "GameLobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameLobby"]

[observability]
enabled = true
