name = "spot-difference-game"
main = "src/index.ts"
compatibility_date = "2026-09-16"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../../apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/ws", "/health", "/catalog"]

[vars]
ALLOWED_ORIGINS = "https://spot-difference-syk.web.tossmini.com,https://spot-difference-syk.private-web.tossmini.com"
PUZZLE_CATALOG_SOURCE = "code"
# database 카탈로그로 바꾸면 그림 주소를 이 R2 전달 Worker로 만든다.
PUZZLE_ASSET_BASE_URL = "https://spot-difference-r2-canary.spot-difference-9barcode.workers.dev"

[[durable_objects.bindings]]
name = "GAME_LOBBY"
class_name = "GameLobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameLobby"]

[observability]
enabled = true

# Production Hyperdrive (query caching disabled).
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "a7dc233f1b3741bab30cad00c06344d2"
