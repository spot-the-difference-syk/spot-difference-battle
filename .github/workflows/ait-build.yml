name: Apps in Toss Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ait:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Run full test suite
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run browser E2E
        run: pnpm e2e

      - name: Run Cloudflare browser E2E
        run: pnpm e2e:cloudflare

      - name: Verify Cloudflare Worker bundle
        run: pnpm --filter @spot-battle/realtime build

      - name: Build Apps in Toss bundle
        run: pnpm build:ait

      - name: Verify AIT bundle
        run: |
          test -f apps/web/spot-difference-syk.ait
          ls -lh apps/web/spot-difference-syk.ait

      - name: Upload AIT bundle
        uses: actions/upload-artifact@v4
        with:
          name: spot-difference-syk-ait
          path: apps/web/spot-difference-syk.ait
          if-no-files-found: error
