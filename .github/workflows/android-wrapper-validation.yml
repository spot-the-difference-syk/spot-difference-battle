name: Android Wrapper Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/android/**"
      - "scripts/copy-android-web.mjs"
      - "package.json"
      - "docs/android-*.md"

jobs:
  ait-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Type check
        run: pnpm check
      - name: Test
        run: pnpm test
      - name: Build existing AIT bundle
        run: pnpm build:ait
      - name: Verify existing AIT bundle
        run: test -f apps/web/spot-difference-syk.ait

  android-wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
      - run: pnpm install --no-frozen-lockfile
      - name: Build Android web assets
        run: pnpm package:android:web
      - name: Validate Gradle wrapper configuration
        run: grep -q "gradle-8.13-bin.zip" apps/android/gradle/wrapper/gradle-wrapper.properties
