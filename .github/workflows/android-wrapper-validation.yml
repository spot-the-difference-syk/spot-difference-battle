name: Android APK Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/android/**"
      - "scripts/build-cloudflare.mjs"
      - "scripts/production.config.json"
      - ".github/workflows/android-wrapper-validation.yml"

jobs:
  ait-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Type check
        run: pnpm check
      - name: Test
        run: pnpm test
      - name: Build existing AIT bundle
        run: pnpm build:ait
      - name: Verify existing AIT bundle
        run: test -f apps/web/spot-difference-syk.ait

  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
      - run: pnpm install --no-frozen-lockfile
      - name: Build Android web assets
        run: pnpm package:android:web
      - name: Verify the bundle points at the production game server
        run: grep -q "$(node -p "require('./scripts/production.config.json').gameServerUrl")" apps/android/app/src/main/assets/assets/*.js
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: apps/android
      - name: Verify debug APK
        run: test -f apps/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: spot-difference-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
