name: Android Wrapper Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/android/**"
      - "scripts/copy-android-web.mjs"
      - "package.json"
      - "docs/android-*.md"

jobs:
  ait-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Type check
        run: pnpm check
      - name: Test
        run: pnpm test
      - name: Build existing AIT bundle
        run: pnpm build:ait
      - name: Verify existing AIT bundle
        run: test -f apps/web/spot-difference-syk.ait

  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
      - run: pnpm install --no-frozen-lockfile
      - name: Build Android web assets
        run: pnpm package:android:web
      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        run: gradle -p apps/android :app:assembleDebug --no-daemon
      - name: Verify debug APK
        run: test -f apps/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: spot-difference-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
